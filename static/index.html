<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WeatherGPT - Conversational NWP AI</title>
  <meta name="description" content="AI assistant routing numerical weather prediction data and spatial hazard alerts in Hindi, Marathi, and English.">
  <meta name="theme-color" content="#064e3b">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN with configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans Devanagari"', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            whatsapp: {
              teal: '#075E54',
              green: '#128C7E',
              light: '#25D366',
              bg: '#EFEAE2',
              darkbg: '#0c1317',
              chatdark: '#111b21',
              carddark: '#202c33',
              outgoing: '#d9fdd3',
              outgoingDark: '#005c4b'
            },
            agri: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 and Babel Standalone for Zero-Build-Step execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
      overscroll-behavior: none;
      font-size: 16px;
    }
    :lang(hi), :lang(mr), [lang="hi"], [lang="mr"] {
      font-family: 'Noto Sans Devanagari', 'Plus Jakarta Sans', sans-serif;
      line-height: 1.75;
    }
    .chat-pattern {
      background-image: radial-gradient(rgba(18, 140, 126, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }
    .recording-pulse {
      animation: pulse-ring 1.5s infinite cubic-bezier(0.45, 0, 0.55, 1);
    }
    @keyframes soundwave {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }
    .wave-bar {
      animation: soundwave 1s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; }
    .wave-bar:nth-child(5) { animation-delay: 0.2s; }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col antialiased select-none">
  <div id="root" class="h-full flex flex-col"></div>

  <!-- Main React App Script (Cache-busted) -->
  <script type="text/babel" src="/static/app.jsx?v=2.0.0"></script>
</body>
</html>
